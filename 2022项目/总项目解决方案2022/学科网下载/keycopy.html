<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量添加前缀工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        
        .description {
            text-align: center;
            margin-bottom: 30px;
            color: #7f8c8d;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            border-color: #3498db;
            outline: none;
        }
        
        .prefix-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .prefix-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .btn {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        
        .btn:hover {
            background-color: #2980b9;
        }
        
        .btn-secondary {
            background-color: #95a5a6;
        }
        
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }
        
        .btn-success {
            background-color: #27ae60;
        }
        
        .btn-success:hover {
            background-color: #219955;
        }
        
        .result-container {
            margin-top: 30px;
        }
        
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: flex-end;
        }
        
        .info {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4fc;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .info h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .info ul {
            padding-left: 20px;
        }
        
        .info li {
            margin-bottom: 5px;
        }
        
        @media (max-width: 600px) {
            .prefix-controls {
                flex-direction: column;
            }
            
            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>批量添加前缀工具</h1>
        <p class="description">在下方输入需要添加前缀的文本，每行内容将被视为单独的一项</p>
        
        <div class="input-group">
            <label for="inputText">输入文本（每行一项）：</label>
            <textarea id="inputText" placeholder="例如：
项目1
项目2
项目3"></textarea>
        </div>
        
        <div class="prefix-controls">
            <input type="text" id="prefix" class="prefix-input" placeholder="输入前缀，例如：前缀-">
            <button id="addPrefixBtn" class="btn">添加前缀</button>
        </div>
        
        <div class="result-container">
            <label for="outputText">结果：</label>
            <textarea id="outputText" readonly></textarea>
            <div class="actions">
                <button id="copyBtn" class="btn btn-secondary">复制结果</button>
                <button id="clearBtn" class="btn btn-secondary">清空所有</button>
            </div>
        </div>
        
        <div class="info">
            <h3>使用说明：</h3>
            <ul>
                <li>在文本框中输入需要添加前缀的内容，每行代表一个独立项</li>
                <li>在"前缀"输入框中输入要添加的前缀文本</li>
                <li>点击"添加前缀"按钮，系统会为每一行内容添加指定前缀</li>
                <li>可以使用"复制结果"按钮快速复制处理后的内容</li>
                <li>"清空所有"按钮可以清空所有输入和输出内容</li>
            </ul>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputText = document.getElementById('inputText');
            const prefixInput = document.getElementById('prefix');
            const outputText = document.getElementById('outputText');
            const addPrefixBtn = document.getElementById('addPrefixBtn');
            const copyBtn = document.getElementById('copyBtn');
            const clearBtn = document.getElementById('clearBtn');
            
            // 添加前缀功能
            addPrefixBtn.addEventListener('click', function() {
                const prefix = prefixInput.value.trim();
                const lines = inputText.value.split('\n');
                
                if (lines.length === 0 || (lines.length === 1 && lines[0].trim() === '')) {
                    outputText.value = '请输入要处理的文本内容';
                    return;
                }
                
                const result = lines.map(line => {
                    if (line.trim() === '') return line; // 保留空行
                    return prefix + line;
                }).join('\n');
                
                outputText.value = result;
            });
            
            // 复制结果功能
            copyBtn.addEventListener('click', function() {
                if (outputText.value.trim() === '') {
                    alert('没有可复制的内容');
                    return;
                }
                
                outputText.select();
                document.execCommand('copy');
                
                // 显示复制成功提示
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '已复制!';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            });
            
            // 清空所有功能
            clearBtn.addEventListener('click', function() {
                inputText.value = '';
                prefixInput.value = '';
                outputText.value = '';
            });
            
            // 示例数据填充（可选）
            inputText.value = "苹果\n香蕉\n橙子\n葡萄";
            prefixInput.value = "水果-";
        });
    </script>
</body>
</html>
